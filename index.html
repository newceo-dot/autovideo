    async function askClaude(prompt, apiKey, proxyUrl = "", maxTokens = 4000, useWebSearch = false) {
      const body = {
        model: "claude-3-5-sonnet-20241022",
        max_tokens: maxTokens,
        messages: [{ role: "user", content: prompt }],
      };
      if (useWebSearch) {
        body.tools = [{ type: "web_search_20250305", name: "web_search" }];
      }

      const url = proxyUrl 
        ? `${proxyUrl.replace(/\/$/, "")}/v1/messages` 
        : "https://api.anthropic.com/v1/messages";

      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error?.message || `Claude API Error (Status ${res.status})`);
      }

      const data = await res.json();
      const text = data.content
        .filter(b => b.type === "text")
        .map(b => b.text)
        .join("\n");
      return text;
    }

    async function askGemini(prompt, apiKey, useWebSearch = false) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
      
      const body = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: "application/json"
        }
      };

      if (useWebSearch) {
        body.tools = [{ googleSearch: {} }];
      }

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error?.message || `Gemini API Error (Status ${res.status})`);
      }

      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error("Gemini가 유효한 텍스트를 응답하지 않았습니다.");
      return text;
    }

    async function askTextGenerator(prompt, engine, keys, useWebSearch = false) {
      if (engine === "claude") {
        if (!keys.claudeKey) throw new Error("설정페이지에서 Claude API 키를 입력해주세요.");
        return await askClaude(prompt, keys.claudeKey, keys.claudeProxy, 4000, useWebSearch);
      } else {
        if (!keys.geminiKey) throw new Error("설정페이지에서 Gemini API 키를 입력해주세요.");
        return await askGemini(prompt, keys.geminiKey, useWebSearch);
      }
    }

    async function geminiImage(prompt, apiKey) {
      const endpoints = [
        {
          url: `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`,
          body: { instances: [{ prompt }], parameters: { sampleCount: 1, aspectRatio: "16:9" } },
          parse: (data) => {
            if (data.error) throw new Error(data.error.message);
            const b64 = data.predictions?.[0]?.bytesBase64Encoded;
            if (!b64) throw new Error("no image predictions");
            return `data:image/png;base64,${b64}`;
          }
        },
        {
          url: `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`,
          body: { contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseModalities: ["IMAGE"] } },
          parse: (data) => {
            if (data.error) throw new Error(data.error.message);
            const imgPart = data.candidates?.[0]?.content?.parts?.find((p) => p.inlineData);
            if (!imgPart) throw new Error("no inlineData image");
            return `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
          }
        },
        {
          url: `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
          body: { contents: [{ parts: [{ text: "Generate an image: " + prompt }] }], generationConfig: { responseModalities: ["IMAGE", "TEXT"] } },
          parse: (data) => {
            if (data.error) throw new Error(data.error.message);
            const imgPart = data.candidates?.[0]?.content?.parts?.find((p) => p.inlineData);
            if (!imgPart) throw new Error("no inlineData image");
            return `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
          }
        }
      ];

      let lastErr = "";
      for (const ep of endpoints) {
        try {
          const res = await fetch(ep.url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ep.body),
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP ${res.status}`);
          }
          const data = await res.json();
          return ep.parse(data);
        } catch (e) {
          lastErr = e.message;
          continue;
        }
      }
      throw new Error(`이미지 생성 실패: ${lastErr}`);
    }

    // JSON parsing utility with fallbacks for markdown codeblock wrapping
    function parseJSONResponse(txt) {
      const clean = txt.trim();
      try {
        return JSON.parse(clean);

        const match = clean.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
        if (!match) throw new Error("출력물에서 유효한 JSON을 찾지 못했습니다.");
        return JSON.parse(match[0]);

    function TTSPage({ scenes, images, title, onBack }) {
      const [voices, setVoices] = useState([]);
      const [voice, setVoice] = useState("");
      const [playing, setPlaying] = useState(-1);
      const [fullSpeechPlaying, setFullSpeechPlaying] = useState(false);
      const playQueueRef = useRef([]);
      const activeUtteranceRef = useRef(null);

      useEffect(() => {
        const load = () => {
          const v = speechSynthesis.getVoices();
          const kr = v.filter((x) => x.lang.includes("ko"));
          const list = kr.length > 0 ? kr : v.slice(0, 10);
          setVoices(list);
          if (list.length > 0) {
            // Prefer a natural voice if available
            const preferred = list.find(x => x.name.includes("Google") || x.name.includes("Natural"));
            setVoice(preferred ? preferred.name : list[0].name);
          }
        };
        load();
        speechSynthesis.onvoiceschanged = load;
        return () => speechSynthesis.cancel();
      }, []);

      const speak = (text, idx = -1, onEndCallback = null) => {
        speechSynthesis.cancel();
        
        const u = new SpeechSynthesisUtterance(text);
        const selectedVoiceObj = voices.find((x) => x.name === voice);
        if (selectedVoiceObj) u.voice = selectedVoiceObj;
        u.lang = "ko-KR"; 
        u.rate = 1.05;
        
        u.onstart = () => {
          setPlaying(idx);
          activeUtteranceRef.current = u;
        };
        u.onend = () => {
          setPlaying(-1);
          activeUtteranceRef.current = null;
          if (onEndCallback) onEndCallback();
        };
        u.onerror = () => {
          setPlaying(-1);
          activeUtteranceRef.current = null;
          if (onEndCallback) onEndCallback();
        };
        
        speechSynthesis.speak(u);
      };

      const stopSpeak = () => {
        speechSynthesis.cancel();
        setPlaying(-1);
        setFullSpeechPlaying(false);
        playQueueRef.current = [];
        activeUtteranceRef.current = null;
      };

      const playFullNarration = () => {
        stopSpeak();
        setFullSpeechPlaying(true);
        
        // Build sequence queue
        let currentIdx = 0;
        
        const playNext = () => {
          if (currentIdx >= scenes.length) {
            setFullSpeechPlaying(false);
            return;
          }
          speak(scenes[currentIdx].narration, currentIdx, () => {
            currentIdx++;
            playNext();
          });
        };
        
        playNext();
      };

      const downloadProject = () => {
        const data = { title, scenes, voiceUsed: voice, timestamp: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = `${title.substring(0, 20)}_project.json`; a.click();
      };

      const downloadImage = (sceneId) => {
        const img = images[sceneId];
        if (!img) return;
        const a = document.createElement("a"); a.href = img; a.download = `scene_${sceneId}.png`; a.click();
      };

      const downloadAllImages = () => {
        scenes.forEach(s => {
          if (images[s.id]) {
            downloadImage(s.id);
          }
        });
      };

      return (
        <div style={{ minHeight: "100vh" }} className="animate-fade">
          <Header title="내레이션 오디오 & 추출" sub={`🎬 ${title}`} step={5} total={5} onBack={onBack} />

          <div style={{ maxWidth: 840, margin: "32px auto", padding: "0 24px" }}>
            
            {/* Player Controller */}
            <div className="glass-card" style={{ padding: "24px", marginBottom: 20, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16 }}>
              <div>
                <h3 style={{ fontSize: 15, fontWeight: 800, color: "#e8eaf0", marginBottom: 4 }}>전체 대본 미리듣기</h3>
                <p style={{ color: "#8b95a5", fontSize: 12 }}>선택한 오디오 성우로 비디오의 전체 대본을 순차 재생합니다.</p>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                {fullSpeechPlaying ? (
                  <button id="tts-stop-all-btn" onClick={stopSpeak} style={{ background: "rgba(239, 68, 68, 0.15)", color: "#fca5a5", border: "1px solid rgba(239, 68, 68, 0.2)", padding: "10px 20px", borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
                    ⏹ 일시정지
                  </button>
                ) : (
                  <button id="tts-play-all-btn" onClick={playFullNarration} style={{ background: "rgba(16, 185, 129, 0.15)", color: "#10b981", border: "1px solid rgba(16, 185, 129, 0.2)", padding: "10px 20px", borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
                    ▶ 전체 스크립트 연속 재생

              </div>
            </div>

            {/* Voice selector */}
            <div className="glass-card" style={{ padding: "28px", marginBottom: 20 }}>
              <div style={{ color: "#8b95a5", fontSize: 13, fontWeight: 700, marginBottom: 16 }}>🔊 한국어 성우 선택 (브라우저 내장 음성합성 엔진)</div>
              {voices.length === 0 ? (
                <div style={{ color: "#4e5968", fontSize: 13, padding: "10px", background: "rgba(20,24,41,0.3)", borderRadius: 8 }}>음성 라이브러리를 탐색하는 중입니다... (한국어 음성이 활성화되어 있어야 청취가 가능합니다)</div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>

                      style={{
                        background: voice === v.name ? "rgba(79, 134, 247, 0.08)" : "rgba(20, 24, 41, 0.5)",
                        border: `1px solid ${voice === v.name ? "#4f86f7" : "rgba(255, 255, 255, 0.06)"}`,

                      <div style={{ color: "#e8eaf0", fontSize: 13, fontWeight: 700 }}>

                      <div style={{ color: "#8b95a5", fontSize: 11, marginTop: 4 }}>{v.lang}</div>
                      <button onClick={(e) => { e.stopPropagation(); speak("안녕하세요. 매끄러운 오디오 생성을 위한 성우 목소리 테스트입니다."); }}
                        style={{ marginTop: 10, background: "rgba(5, 150, 105, 0.15)", color: "#10b981", border: "1px solid rgba(5, 150, 105, 0.2)", padding: "4px 12px", borderRadius: 5, fontSize: 11, cursor: "pointer", fontWeight: 700 }}>
                        🔊 테스트 청취
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Scene list */}
            <div className="glass-card" style={{ padding: "28px", marginBottom: 20 }}>
              <div style={{ color: "#8b95a5", fontSize: 13, fontWeight: 700, marginBottom: 16 }}>📋 장면별 시나리오 구성 현황</div>
              
              <div style={{ display: "flex", flexDirection: "column" }}>
                {scenes.map((scene, i) => (
                  <div key={scene.id} 
                    id={`tts-scene-row-${scene.id}`}
                    style={{
                      display: "grid", gridTemplateColumns: "100px 1fr auto", gap: 20, alignItems: "start",
                      padding: "18px 0", borderBottom: i < scenes.length - 1 ? "1px solid rgba(255, 255, 255, 0.06)" : "none",
                    }}
                  >
                    {/* Thumbnail */}
                    <div style={{ width: 100, height: 60, background: "rgba(20, 24, 41, 0.6)", borderRadius: 8, overflow: "hidden", border: "1px solid rgba(255,255,255,0.05)" }}>
                      {images[scene.id] ? (
                        <img src={images[scene.id]} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      ) : (
                        <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: "#4e5968", fontSize: 18 }}>🖼️</div>
                      )}
                    </div>

                    <div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                        <div style={{ color: "#4f86f7", fontSize: 11, fontWeight: 800 }}>SCENE {scene.id} · {scene.seconds}초</div>

                    </div>

                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>

                        style={{

                          color: playing === i ? "#f87171" : "#8b95a5",

    function BlogConvertPage({ type, keys, onNext, onBack }) {
      const [blogText, setBlogText] = useState("");
      const [blogUrl, setBlogUrl] = useState("");
      const [convertType, setConvertType] = useState("longform");
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");

      const convert = async () => {
        if (!blogText.trim() && !blogUrl.trim()) { setErr("분석할 블로그 원고 글귀를 복사해 붙여넣거나 URL 주소를 채워주세요."); return; }
        setLoading(true); setErr("");
        try {
          const sceneCount = convertType === "shorts" ? 5 : 12;
          const inputText = blogText.trim() || `URL: ${blogUrl.trim()} 원문 분석 요청`;
          
          const txt = await askTextGenerator(
            `당신은 블로그 줄글 원고를 유입률이 높은 고품질 유튜브 비디오 대본으로 가공하는 시나리오 디렉터입니다.

[블로그 텍스트 데이터]
${inputText}

[변환 요구조건]
- 영상 규격: ${convertType === "shorts" ? "쇼츠 (총 60초 내외, 강렬하고 빠른 호흡)" : "롱폼 (가로 분석 비디오, 논리 정연한 기승전결)"}
- 구성할 전체 장면 수: ${sceneCount}개
- 건조한 블로그 문어체를 유튜브 청자가 듣기 자연스럽고 흡입력 있는 구어체 내레이션으로 변조해야 합니다.
- 스크립트 시작 부분(도입부)에 시청자를 붙잡을 수 있는 강력한 후킹 멘트(Hook)를 삽입하세요.
- 각 씬에 배치될 시각 자료를 만들기 위해 정교하게 묘사된 이미지 프롬프트를 영어로 작성해 주세요. (Imagen 3 전용 프롬프트이며, 텍스트나 워터마크 등을 일절 표현해서는 안 됩니다)

반드시 다음 JSON 규격으로만 정확하게 변환하여 반환해 주세요 (마크다운 백틱 \`\`\`json 등 절대 금지):
{
  "title": "유튜브 업로드용 최적화 제목",
  "originalSummary": "원본 블로그의 핵심 내용 요약 (1-2문장)",
  "scenes": [
    {
      "id": 1,
      "narration": "장면 내레이션 오디오 스크립트",
      "emotion": "감정의 톤앤매너",
      "imagePrompt": "영문 이미지 지시 프롬프트",
      "seconds": 10
    }
  ]
}`,
            keys.engine,
            keys,
            false
          );

          const data = parseJSONResponse(txt);
          if (!data.scenes || !Array.isArray(data.scenes)) {
            throw new Error("대본 데이터 구조가 유효하지 않습니다.");
          }

          onNext(data.title || "블로그 변환 프로젝트", data.scenes, convertType, data.originalSummary);
        } catch (e) { 
          setErr(`블로그 변환 실패: ${e.message}\n(API 키를 제대로 입력했는지 설정 탭을 다시 체크해보세요.)`); 
        }
        setLoading(false);
      };

      return (
        <div style={{ minHeight: "100vh" }} className="animate-fade">
          {loading && <LoadingOverlay text="📝 블로그 구조 분석 및 유튜브 대본 변환 중..." />}
          <Header title="블로그 → 유튜브 변환기" sub="텍스트 중심의 블로그 원고를 영상에 맞는 시각 시나리오로 컴파일합니다" onBack={onBack} />
          
          <div style={{ maxWidth: 700, margin: "32px auto", padding: "0 24px" }}>
            <div className="glass-card" style={{ padding: "32px" }}>
              
              {/* Type selector */}
              <div style={{ marginBottom: 24 }}>
                <div style={{ color: "#8b95a5", fontSize: 13, marginBottom: 12, fontWeight: 700 }}>1. 변환할 비디오 플랫폼 규격</div>
                <div style={{ display: "flex", gap: 12 }}>
                  {[
                    { id: "shorts", label: "✂️ 세로 쇼츠", desc: "핵심 요약 숏폼 (5개 장면)" },
                    { id: "longform", label: "🎬 가로 롱폼", desc: "내러티브 중심 풀 비디오 (12개 장면)" },
                  ].map(t => (
                    <div key={t.id} 
                      id={`convert-type-${t.id}`}
                      onClick={() => setConvertType(t.id)}
                      style={{
                        flex: 1, padding: "16px", borderRadius: 12, cursor: "pointer",
                        background: convertType === t.id ? "rgba(79, 134, 247, 0.08)" : "rgba(20, 24, 41, 0.5)",
                        border: `1px solid ${convertType === t.id ? "#4f86f7" : "rgba(255, 255, 255, 0.06)"}`,
                        transition: "all 0.15s",
                      }}>
                      <div style={{ color: "#e8eaf0", fontWeight: 800, fontSize: 15 }}>{t.label}</div>
                      <div style={{ color: "#8b95a5", fontSize: 12, marginTop: 4 }}>{t.desc}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* URL input */}
              <div style={{ marginBottom: 20 }}>
                <div style={{ color: "#8b95a5", fontSize: 13, marginBottom: 8, fontWeight: 700 }}>2. 블로그 글 URL (선택)</div>
                <input
                  id="blog-url-input"
                  value={blogUrl} onChange={e => setBlogUrl(e.target.value)}
                  placeholder="https://blog.naver.com/지정주소... 혹은 티스토리 링크..."
                  className="form-input"
                />
              </div>

              {/* Textarea for body */}
              <div style={{ marginBottom: 20 }}>
                <div style={{ color: "#8b95a5", fontSize: 13, marginBottom: 8, fontWeight: 700, display: "flex", justifyContent: "space-between" }}>
                  <span>3. 블로그 원본 본문 복사 붙여넣기</span>
                  <span style={{ color: "#4e5968", fontWeight: 400 }}>{blogText.length.toLocaleString()} 자 입력됨</span>
                </div>
                <textarea
                  id="blog-text-input"
                  value={blogText} onChange={e => setBlogText(e.target.value)}
                  placeholder="블로그 기사 글이나 포스팅 텍스트를 이곳에 마우스 우클릭으로 고스란히 복사 붙여넣기 해주세요. 내용이 많고 구체적일수록 고화질 일러스트와 정확한 오디오 대본이 생성됩니다."
                  rows={10}
                  className="form-input"
                  style={{ resize: "vertical", lineHeight: 1.7, fontFamily: "inherit" }}
                />
              </div>

              <ErrorBox msg={err} />

              <PrimaryBtn id="blog-convert-submit-btn" onClick={convert} disabled={!blogText.trim() && !blogUrl.trim()} style={{ width: "100%", padding: "14px 24px", fontSize: 15 }}>
                🔄 대본 및 시나리오로 변환 작업 개시
              </PrimaryBtn>

              <div style={{ marginTop: 20, background: "rgba(20, 24, 41, 0.4)", borderRadius: 10, padding: "14px 18px", fontSize: 12, color: "#8b95a5", lineHeight: 1.8, border: "1px solid rgba(255,255,255,0.03)" }}>
                💡 <strong>변환 시 유용한 팁:</strong> 블로그의 메인 핵심 주장과 설명이 명확하게 담긴 텍스트를 함께 붙여주시면, AI가 논리적 구조를 유지하면서 시각적 메타포가 강한 일러스트 연출을 제안하게 됩니다.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============ MAIN APP ============

    function App() {
      const [page, setPage] = useState("home");
      const [type, setType] = useState(""); // shorts or longform
      const [blogSummary, setBlogSummary] = useState("");
      const [topics, setTopics] = useState([]);
      const [keyword, setKeyword] = useState("");
      const [category, setCategory] = useState("");
      const [selectedTopic, setSelectedTopic] = useState("");
      const [videoTitle, setVideoTitle] = useState("");
      const [scenes, setScenes] = useState([]);
      const [style, setStyle] = useState("realistic");
      const [charType, setCharType] = useState("외국인 모델");
      const [images, setImages] = useState({});

      // State for keeping API keys and selected LLM engine
      const [keys, setKeys] = useState(() => {
        return {
          geminiKey: localStorage.getItem("gemini_api_key") || "",
          claudeKey: localStorage.getItem("claude_api_key") || "",
          claudeProxy: localStorage.getItem("claude_proxy_url") || "",
          engine: localStorage.getItem("text_engine") || "gemini"
        };
      });

      // Synchronize keys with localStorage on changes
      useEffect(() => {
        localStorage.setItem("gemini_api_key", keys.geminiKey);
        localStorage.setItem("claude_api_key", keys.claudeKey);
        localStorage.setItem("claude_proxy_url", keys.claudeProxy);
        localStorage.setItem("text_engine", keys.engine);
      }, [keys]);

      return (
        <div>
          {page === "home" && (
            <HomePage onSelect={(t, action) => { setType(t); setPage(action || "trend"); }} />
          )}
          {page === "blog" && (
            <BlogConvertPage
              type={type}
              keys={keys}
              onNext={(t, s, ctype, summary) => {
                setVideoTitle(t); setScenes(s); setType(ctype);
                setBlogSummary(summary || ""); setPage("style");
              }}
              onBack={() => setPage("home")}
            />
          )}
          {page === "trend" && (
            <TrendPage
              type={type}
              keys={keys}
              onNext={(arr, kw, cat) => { setTopics(arr); setKeyword(kw || ""); setCategory(cat || ""); setPage("topic_select"); }}
              onBack={() => setPage("home")}
            />
          )}
          {page === "topic_select" && (
            <TopicSelectPage
              topics={topics} type={type} keyword={keyword} category={category} keys={keys}
              onNext={(t, s, topic) => { setVideoTitle(t); setScenes(s); setSelectedTopic(topic); setPage("style"); }}
              onBack={() => setPage("trend")}
            />
          )}
          {page === "style" && (
            <StylePage
              keys={keys}
              setKeys={setKeys}
              style={style}
              setStyle={setStyle}
              charType={charType}
              setCharType={setCharType}
              onNext={() => setPage("generate")}
              onBack={() => {
                // If it was converted from blog, go back to blog, otherwise to topic_select
                if (selectedTopic) {
                  setPage("topic_select");
                } else {
                  setPage("blog");
                }
              }}
            />
          )}
          {page === "generate" && (
            <GeneratePage
              title={videoTitle} scenes={scenes} style={style}
              charType={charType} keys={keys} setKeys={setKeys}
              images={images} setImages={setImages}
              onNext={() => setPage("tts")}
              onBack={() => setPage("style")}
            />
          )}
          {page === "tts" && (
            <TTSPage
              scenes={scenes} images={images} title={videoTitle}
              onBack={() => setPage("generate")}
            />
          )}
        </div>
      );
    }

    // Mount to root DOM node
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
